# A few sentences in your own voice. Shown at the top of the page.
bio: >
  I study the atmosphere where it meets people: urban air quality, aerosol
  chemistry, and the weather and climate forces that shape energy, aviation,
  and agriculture. My work spans high-resolution, convection-permitting
  modeling, open-source model evaluation tools like MELODIES-MONET, and
  communicating climate uncertainty to the decision makers who rely on it.

research_interests:
  - "**Atmospheric chemistry and aerosol composition** in urban areas"
  - "**Economic impacts** of meteorological and climatological factors (e.g. aviation and agriculture)"
  - "**Coupled atmosphere–ocean feedbacks** such as the El Niño–Southern Oscillation (ENSO)"
  - "**High-resolution, convection-permitting modeling** for operational pollution and weather forecasting"
  - "Understanding the **impacts of climate change** on societies"
  - "**Enhancing teaching methods** and educational quality in STEM"

